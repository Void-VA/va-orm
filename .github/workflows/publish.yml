name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != package.json v$VERSION"
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # No NPM_TOKEN: npm exchanges the GitHub OIDC token for a short-lived
      # publish credential. Configure the trusted publisher on npmjs.com:
      #   repository Void-VA/va-orm · workflow publish.yml
      # Trusted publisher created after 2026-09-03 only allows `npm stage publish`
      # by default. Enabling "Allow npm publish" on npmjs.com lets this step be
      # plain `npm publish` instead — see README "Releasing".
      # Prereleases require an explicit --tag; we publish them to latest so the
      # npm page and `npm i` pick up the new build.
      - name: Stage publish
        run: npm stage publish --tag latest

      - name: How to finish
        run: |
          echo "::notice::Package staged. Approve it with 2FA to publish:"
          echo "  npm stage list @v-va/orm"
          echo "  npm stage approve <stage-id>"
          echo "  (or https://www.npmjs.com -> Staged Packages)"
